# Локальный «прод»: приложение + PostgreSQL.  docker compose up --build  → http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cqa
      POSTGRES_USER: cqa
      POSTGRES_PASSWORD: cqa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqa"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://cqa:cqa@db:5432/cqa
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
